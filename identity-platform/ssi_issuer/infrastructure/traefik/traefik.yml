# Traefik Configuration for SSI Issuing Platform
# Production configuration with Docker provider and Let's Encrypt SSL

# Global configuration
global:
  checkNewVersion: false
  sendAnonymousUsage: false

# Entry points configuration
entryPoints:
  # HTTP entry point (port 80) - redirects to HTTPS in production
  web:
    address: ":80"
    http:
      redirections:
        entrypoint:
          to: websecure
          scheme: https
          permanent: true

  # HTTPS entry point (port 443)
  websecure:
    address: ":443"
    http:
      tls:
        options: default

  # Traefik dashboard (port 8080) - for monitoring
  traefik:
    address: ":8080"

# Providers configuration
providers:
  # Docker provider for service discovery
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: "traefik"
    watch: true

  # File provider for additional configuration
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

# Certificate resolvers for Let's Encrypt
certificatesResolvers:
  letsencrypt:
    acme:
      # Let's Encrypt ACME server
      server: https://acme-v02.api.letsencrypt.org/directory
      # Email for Let's Encrypt notifications (set via environment variable)
      email: ${TRAEFIK_EMAIL}
      # Storage for certificates
      storage: /certificates/acme.json
      # Key type
      keyType: EC256
      # HTTP challenge for domain validation
      httpChallenge:
        entryPoint: web
      # TLS challenge as fallback
      tlsChallenge: {}

# API and dashboard configuration
api:
  dashboard: true
  debug: false
  insecure: false

# Metrics configuration
metrics:
  prometheus:
    addEntryPointsLabels: true
    addServicesLabels: true
    addRoutersLabels: true

# Logging configuration
log:
  level: INFO
  format: json

# Access logs
accessLog:
  format: json
  fields:
    defaultMode: keep
    names:
      ClientUsername: drop
    headers:
      defaultMode: keep
      names:
        User-Agent: redact
        Authorization: drop
        Content-Type: keep

# TLS configuration
tls:
  options:
    default:
      sslProtocols:
        - "TLSv1.2"
        - "TLSv1.3"
      cipherSuites:
        - "TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384"
        - "TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305"
        - "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256"
        - "TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256"
      curvePreferences:
        - "CurveP521"
        - "CurveP384"
      minVersion: "VersionTLS12"

# Pilot configuration (disabled for security)
pilot:
  dashboard: false