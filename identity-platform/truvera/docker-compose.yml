services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://192.168.8.100:3000
      - SESSION_SECRET=your-secret-key-change-in-production
      - TRUVERA_API_URL=https://api-testnet.truvera.io
      - TRUVERA_API_KEY=${TRUVERA_API_KEY}
      - ISSUER_DID=${ISSUER_DID}
      - CREDENTIAL_SCHEMA_URL=${CREDENTIAL_SCHEMA_URL}
    networks:
      - ssi-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://192.168.8.100:3001
    depends_on:
      - backend
    networks:
      - ssi-network
    restart: unless-stopped

networks:
  ssi-network:
    driver: bridge